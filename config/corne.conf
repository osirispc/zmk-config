################################
# SPLIT / BLE
################################
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=y

################################
# DISPLAY (OLED)
################################
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
CONFIG_SSD1306=y
CONFIG_I2C=y

CONFIG_ZMK_WIDGET_LAYER_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y
CONFIG_ZMK_WIDGET_WPM_STATUS=y

# SSD1306 defaults to blank-on-idle unless you override it.
# You said you want KEYS to go black on idle, not the OLED.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
# Keep display updates from interfering with scanning/typing.
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y


################################
# RGB UNDERGLOW
################################
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP=y
CONFIG_SPI=y

# IMPORTANT: default is y (underglow toggling also controls external power).
# With AUTO_OFF_IDLE, that can cut power to OLED/rails on some builds.
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# Start state (saved settings can override until you do settings_reset)
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0

# Make it amber (Hue ~ 35 is a nice warm amber/orange)
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=35
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100

# Drop brightness to reduce brownouts / scan weirdness
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=30

# Idle behavior: lights go black quickly when you stop typing
CONFIG_ZMK_IDLE_TIMEOUT=2000
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y


################################
# KEY SCAN / DEBOUNCE (helps repeat/double taps)
################################
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5



################################
# BATTERY (nice!nano)
################################
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ADC=y
CONFIG_NRFX_SAADC=y


################################
# USB
################################
CONFIG_ZMK_USB=y
