################################
# SPLIT / BLE
################################
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=y

################################
# DISPLAY (OLED)
################################
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
CONFIG_SSD1306=y
CONFIG_I2C=y

CONFIG_ZMK_WIDGET_LAYER_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y
CONFIG_ZMK_WIDGET_WPM_STATUS=y

################################
# RGB UNDERGLOW
################################
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP=y
CONFIG_SPI=y

# Start state (NOTE: saved settings can override these until you do settings_reset)
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_STAR=40
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=35
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100


# --- Idle lighting behavior ---
# After 5 seconds of no keypresses, enter idle
CONFIG_ZMK_IDLE_TIMEOUT=5000

# Turn underglow off while idle
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y


################################
# BATTERY (nice!nano)
################################
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ADC=y
CONFIG_NRFX_SAADC=y


################################
# USB
################################
CONFIG_ZMK_USB=y

